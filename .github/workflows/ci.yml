name: CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-20.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/riloraspopo/android_kernel_xiaomi_pipa
          config: defconfig
          arch: arm64
          android-version: 16
          ksu: true
